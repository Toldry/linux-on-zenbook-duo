name: update-flake-lock

# Keeps flake.lock (nixpkgs + home-manager) from going stale. Weekly, or by
# hand; opens a PR so CI reviews the bump before anything lands.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      # Every action here is pinned to a commit SHA, not a tag: this runs
      # unattended with write permissions, so a moved tag would execute
      # whatever landed upstream with this repo's write token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6  # v28
        with:
          pr-title: "chore(flake): update flake.lock"
          commit-msg: "chore(flake): update flake.lock"
          pr-labels: |
            dependencies
            automated
