name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Cuts a release by hand, e.g. 1.0.0, which no commit type ever computes
  # (changelog.d/README.md, "The version number").
  workflow_dispatch:
    inputs:
      version:
        description: "X.Y.Z to release; empty = computed from the commits"
        required: false
        default: ""

jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # The file lists live in the Makefile only; here the linters it skips
      # when missing are installed, so none is skipped.
      - name: make lint (bash -n, shellcheck, py_compile, ruff, fragments, grep -q guard)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          pipx install ruff
          make lint
      # Behavioural tests of the helpers. shellcheck passes on a script whose
      # detection helper returns the wrong answer — that is exactly how the
      # pipefail/SIGPIPE bug shipped. Under sudo so the root-only cases run.
      - name: lib tests
        run: sudo bash tests/test-lib.sh
      - name: install.sh dry run refuses foreign hardware without --force
        run: |
          if ./install.sh --dry-run --user; then echo "user half dry run ok"; else exit 1; fi
          if ./install.sh --dry-run --system 2>/dev/null; then echo "should have refused a non-Duo runner" >&2; exit 1; fi
      - name: system layer dry run on foreign hardware (--force)
        run: sudo bash system/run.sh --dry-run --force --user runner
      - name: CLI runs read-only commands anywhere
        run: |
          bin/duo-cli version
          bin/duo-cli config show
          bin/duo-cli features
          bin/duo version            # the launcher forwards to duo-cli
          bin/duo-cli doctor || true   # a non-Duo runner fails the gate on purpose; it must not crash

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: unit tests (without PyGObject — the layout maths must not need it)
        run: python3 -m unittest discover -s tests -v
      - name: the screen renders without a terminal
        run: |
          bin/duo --help
          for v in overview services settings displays doctor logs; do bin/duo --snapshot $v 100x30 | head -3; done
      - name: unit tests (with PyGObject, the interpreter `duo` pins on Ubuntu)
        run: |
          sudo apt-get install -y -qq python3-gi
          /usr/bin/python3 -m unittest discover -s tests -v
      - name: committed preset matches the generator
        run: diff <(python3 lib/speaker_dsp.py preset) presets/easyeffects/duo-speakers.json

  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: build the package and evaluate the home-manager module
        run: nix flake check --print-build-logs
      - name: the packaged CLI runs
        run: nix run . -- version

  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Releases every push to main that passed all of the above, when the merge
  # brought a changelog.d/ fragment: tools/release.py picks the bump from the
  # Conventional Commit subjects since the last release, writes the dated
  # CHANGELOG.md section, bumps VERSION and deletes the fragments; this job
  # commits that, tags vX.Y.Z and publishes the GitHub release. Nobody bumps by
  # hand. Pushes made with GITHUB_TOKEN start no workflow, so this cannot loop.
  release:
    needs: [shell, python, nix, hygiene]
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # One release at a time; a queued run sees the previous run's commit.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          # Full history: the last commit that changed VERSION is the base.
          fetch-depth: 0
      - id: release
        env:
          FORCED_VERSION: ${{ inputs.version }}
        run: |
          # Release only the commit this run tested. If main moved on, the
          # run for the newer push releases it, this one included.
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved past $GITHUB_SHA; the newer run releases"
            exit 0
          fi
          if [ -n "$FORCED_VERSION" ]; then
            version="$(python3 tools/release.py release --version "$FORCED_VERSION")"
          elif [ "$(python3 tools/release.py level)" = none ]; then
            echo "no changelog.d/ fragment since the last release: nothing to release"
            exit 0
          else
            version="$(python3 tools/release.py release)"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A CHANGELOG.md VERSION changelog.d
          git commit -m "chore(release): $version"
          git tag -a "v$version" -m "linux-on-zenbook-duo $version"
          git push --atomic origin HEAD:main "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: GitHub release with the CHANGELOG section as notes
        if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 tools/release.py notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --verify-tag --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
